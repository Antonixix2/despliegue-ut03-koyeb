events {}

http {
    include mime.types;

    # koyeb escucha en el 8000 y pone el https por fuera
    server {
        listen 8000;

        root /usr/share/nginx/html;
        index index.html;

        location /miscosas {
            root /usr/share/nginx/html;
        }

        location /mascosas {
            alias /usr/share/nginx/html/miscosas;
        }

        location /otrascosas {
            root /usr/share/nginx/html;
            try_files /otrascosas/cosas.html /otrascosas/alt.html =404;
        }

        location ~* /count/[0-9] {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location /cositas {
            return 307 /otrascosas;
        }

        location /restringido/ {
            auth_basic "Autenticacion requerida";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        rewrite ^/number/(\w+) /count/$1;
        rewrite ^/otra\w*$ /otrascosas;
        rewrite "^/[b-df-hj-np-tv-zB-DF-HJ-NP-TV-Z][a-zA-Z0-9]{0,4}/([0-9])$" /count/$1;
    }
}
